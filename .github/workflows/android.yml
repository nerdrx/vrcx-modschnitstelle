name: Android with Mods
on:
  workflow_dispatch:
  pull_request:
    paths: ['android/**', 'src/**', 'package*.json', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npx vitest run src/mods src/platform/android/__tests__ src/services/__tests__/config.test.js src/stores/__tests__/authLoginFailureToast.test.js
      - run: npm run build:android
      - run: ./gradlew assembleDebug assembleDebugAndroidTest
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: VRCX-with-Mods-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
