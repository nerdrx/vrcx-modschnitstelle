# Builds the Windows package publicly and attaches it to a GitHub release.
# Trigger: push a tag like v2026.07.18-mods.1 (or run manually for a test build).
name: Release (VRCX with Mods)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      # Stamp the fork version into the Version file so the built app
      # identifies as e.g. "VRCX 2026.07.18.m3" (tag v2026.07.18-mods.3).
      # No dash: VRCX treats 7-char dash suffixes as nightly-hash builds.
      - name: Stamp fork version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_NAME -like 'v*') {
            $env:GITHUB_REF_NAME -replace '^v','' -replace '-mods\.','.m'
          } else {
            (Get-Content Version -Raw).Trim() + '.m0'
          }
          Set-Content -NoNewline Version $v
          "FORK_VERSION=$v" | Out-File -Append $env:GITHUB_ENV
          Write-Host "Fork version: $v"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: |
          npm ci --include=dev
          npm rebuild

      - name: Run mod tests
        run: npx vitest run src/mods

      - name: Build UI
        run: npm run prod

      - name: Build Windows app (CEF)
        run: dotnet build Dotnet\VRCX-Cef.csproj -c Release

      # Replace the html junction with real files so NSIS/zip package content
      - name: Materialize html folder
        shell: pwsh
        run: |
          cmd /c rmdir build\Cef\html
          robocopy build\html build\Cef\html /E /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -ge 8) { exit 1 }
          exit 0

      # Installer (enables VRCX's built-in auto-updater against this repo)
      - name: Prepare installer version
        shell: pwsh
        run: |
          $numeric = $env:FORK_VERSION -replace '\.m(\d+)$','.$1'
          if ($numeric -notmatch '^\d+\.\d+\.\d+\.\d+$') { $numeric = "$numeric.0" }
          "!define PRODUCT_VERSION_FROM_FILE `"$numeric`"" | Out-File -Encoding ascii Installer/version_define.nsh
          Get-Content Installer/version_define.nsh

      - name: Install NSIS
        run: choco install nsis -y

      - name: Create NSIS installer
        uses: joncloud/makensis-action@v5.0
        with:
          script-file: Installer/installer.nsi
          additional-plugin-paths: Installer/Plugins

      - name: Rename setup
        shell: pwsh
        run: Move-Item Installer/VRCX_Setup.exe "VRCX_$($env:FORK_VERSION)_Setup.exe"

      - name: Package
        shell: pwsh
        run: |
          $staging = "VRCX-with-Mods"
          # robocopy follows the html junction and copies real files
          robocopy build\Cef $staging /E /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -ge 8) { exit 1 }
          Remove-Item "$staging\debug.log" -ErrorAction SilentlyContinue
          Get-ChildItem $staging -Filter *.pdb | Remove-Item -ErrorAction SilentlyContinue
          Copy-Item LICENSE "$staging\LICENSE.txt"
          $name = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { 'manual' }
          Compress-Archive -Path $staging -DestinationPath "VRCX-with-Mods-$name.zip"
          exit 0

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VRCX-with-Mods
          path: |
            VRCX-with-Mods-*.zip
            VRCX_*_Setup.exe

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: VRCX ${{ env.FORK_VERSION }}
          files: |
            VRCX_*_Setup.exe
            VRCX-with-Mods-*.zip
          generate_release_notes: true
          body: |
            **VRCX with Mods** — unofficial VRCX fork with a mod API and
            bundled mods. Built publicly by GitHub Actions from this
            repository's source (see the workflow run for this tag).

            **Downloads:** `VRCX_*_Setup.exe` = installer (used by the
            built-in auto-updater); `VRCX-with-Mods-*.zip` = portable.

            ⚠️ The exe is **unsigned** — Windows SmartScreen will warn on
            first launch ("More info" → "Run anyway").
            ⚠️ Shares its database with a regular VRCX installation — close
            one before starting the other; a backup of
            `%AppData%\VRCX\VRCX.sqlite3` is recommended.

            License: MIT (see LICENSE.txt in the zip). Not affiliated with
            the VRCX team or VRChat Inc.
