<!doctype html>
<!-- MOD-API: P2 VR chat panel page (globaldb mod). Rendered offscreen by
     VRCXVRChatPanel.cs into OpenVR overlay "VRCX3". Static + self-contained:
     no build step, no framework. API surface: window.$vrchat.{update, config,
     keyboardDone, gestureToggle}; actions go out via AppApiVr.ChatPanelAction. -->
<html lang="de">
<head>
<meta charset="utf-8">
<title>VRCX Pool Chat</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { width: 1024px; height: 1024px; background: transparent; overflow: hidden;
        font-family: "Segoe UI", sans-serif; color: #eee; }
    #panel { display: flex; flex-direction: column; width: 100%; height: 100%;
        background: rgba(16, 16, 20, 0.92); border: 2px solid #3a3a44; border-radius: 24px; }
    #panel.hidden { display: none; }

    /* ---------- header ---------- */
    #head { display: flex; align-items: center; gap: 14px; padding: 14px 18px;
        border-bottom: 2px solid #2c2c34; }
    .dot { width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; }
    .dot.green { background: #51e57e; } .dot.yellow { background: #e5c451; } .dot.red { background: #e64a4a; }
    #tabs { display: flex; gap: 10px; overflow-x: hidden; flex: 1; }
    .tab { padding: 10px 20px; border-radius: 14px; background: #26262e; font-size: 26px;
        white-space: nowrap; position: relative; }
    .tab.active { background: #3d6ae0; }
    .tab .badge { position: absolute; top: -8px; right: -8px; background: #e64a4a; color: #fff;
        border-radius: 12px; min-width: 24px; height: 24px; font-size: 18px; text-align: center;
        line-height: 24px; padding: 0 5px; }
    .hbtn { padding: 10px 16px; border-radius: 14px; background: #26262e; font-size: 24px; flex-shrink: 0; }
    .hbtn.active { background: #3d6ae0; }

    /* ---------- messages ---------- */
    #msgs { flex: 1; overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 85%; background: #26262e; border-radius: 16px; padding: 10px 16px; font-size: 28px;
        line-height: 1.3; word-wrap: break-word; }
    .msg.mine { align-self: flex-end; background: #2c4a8f; }
    .msg .who { font-size: 20px; color: #9aa0ae; margin-bottom: 2px; }
    .msg.system { align-self: center; background: none; color: #9aa0ae; font-size: 22px; font-style: italic; }
    .msg .invite { color: #51e57e; font-weight: 600; }
    #typing { min-height: 30px; font-size: 22px; color: #9aa0ae; padding: 0 20px; }

    /* ---------- quick replies + input ---------- */
    #quick { display: flex; gap: 10px; padding: 8px 18px; flex-wrap: wrap; }
    .qbtn { padding: 14px 22px; border-radius: 16px; background: #26262e; font-size: 26px; }
    #inputrow { display: flex; gap: 12px; padding: 12px 18px 18px; }
    #inputfield { flex: 1; background: #1c1c22; border: 2px solid #3a3a44; border-radius: 16px;
        padding: 14px 18px; font-size: 28px; color: #eee; min-height: 60px; overflow: hidden;
        white-space: nowrap; }
    #inputfield.empty { color: #666; }
    #send { padding: 14px 30px; border-radius: 16px; background: #3d6ae0; font-size: 30px; }
    #send.disabled { background: #26262e; color: #666; }

    /* ---------- settings strip ---------- */
    #settings { display: none; gap: 10px; padding: 8px 18px; flex-wrap: wrap; align-items: center;
        border-top: 2px solid #2c2c34; font-size: 24px; }
    #settings.open { display: flex; }

    /* ---------- minimized bubble ---------- */
    #bubble { display: none; position: absolute; right: 40px; bottom: 40px; width: 140px; height: 140px;
        border-radius: 50%; background: rgba(22, 22, 28, 0.95); border: 3px solid #3a3a44;
        align-items: center; justify-content: center; flex-direction: column; }
    #bubble.show { display: flex; }
    #bubble .icon { font-size: 48px; }
    #bubble .badge { position: absolute; top: 0; right: 0; background: #e64a4a; color: #fff;
        border-radius: 18px; min-width: 36px; height: 36px; font-size: 26px; text-align: center;
        line-height: 36px; padding: 0 8px; }
    #bubble .dot { position: absolute; bottom: 6px; width: 22px; height: 22px; }

    /* ---------- emojis + dragbar ---------- */
    #emojis { display: none; flex-wrap: wrap; gap: 8px; padding: 8px 18px; }
    #emojis.open { display: flex; }
    #emojis .ebtn { font-size: 38px; padding: 8px 12px; border-radius: 12px; background: #26262e; }
    #dragbar { height: 56px; margin: 4px 18px 12px; border-radius: 14px; background: #26262e;
        text-align: center; font-size: 40px; line-height: 34px; color: #666;
        border: 2px dashed #3a3a44; }
    #dragbar:hover { outline: 3px solid #3d6ae0; }

    /* ---------- mini (wrist) ---------- */
    #mini { display: none; position: absolute; inset: 0; padding: 30px;
        background: rgba(16, 16, 20, 0.92); border: 3px solid #3a3a44; border-radius: 40px;
        flex-direction: column; gap: 18px; justify-content: center; }
    #mini.show { display: flex; }
    #mini .head { display: flex; align-items: center; gap: 18px; }
    #mini .head .dot { width: 34px; height: 34px; }
    #mini .head .badge { background: #e64a4a; color: #fff; border-radius: 20px; min-width: 40px;
        height: 40px; font-size: 30px; text-align: center; line-height: 40px; padding: 0 10px; }
    #mini .head .title { font-size: 34px; color: #9aa0ae; flex: 1; }
    #mini .who { font-size: 34px; color: #9aa0ae; }
    #mini .txt { font-size: 44px; line-height: 1.25; word-wrap: break-word; max-height: 620px; overflow: hidden; }
    #mini .hint { font-size: 28px; color: #666; }

    /* ---------- laser cursor ---------- */
    #cursor { display: none; position: absolute; width: 22px; height: 22px; border-radius: 50%;
        background: rgba(255, 255, 255, 0.9); border: 3px solid #3d6ae0; pointer-events: none;
        transform: translate(-50%, -50%); z-index: 99; }
    .hbtn:hover, .tab:hover, .qbtn:hover, #send:hover, #inputfield:hover { outline: 3px solid #3d6ae0; }
</style>
</head>
<body>
<div id="panel">
    <div id="head">
        <div id="ampel" class="dot green"></div>
        <div id="apiwarn" style="display:none;color:#e64a4a;font-size:26px" title="AppApiVr-Bindung fehlgeschlagen">&#9888;</div>
        <div id="tabs"></div>
        <div id="modebtn" class="hbtn">HUD</div>
        <div id="gearbtn" class="hbtn">&#9881;</div>
        <div id="minbtn" class="hbtn">&#8211;</div>
    </div>
    <div id="msgs"></div>
    <div id="typing"></div>
    <div id="quick"></div>
    <div id="inputrow">
        <div id="emojibtn" class="hbtn">&#128578;</div>
        <div id="inputfield" class="empty">Nachricht eingeben…</div>
        <div id="send" class="disabled">Senden</div>
    </div>
    <div id="emojis"></div>
    <div id="dragbar" title="Ziehen zum Verschieben">&#8230;</div>
    <div id="settings">
        <span>Deckkraft</span>
        <div class="hbtn" data-alpha="-0.1">−</div>
        <div class="hbtn" data-alpha="0.1">+</div>
        <span style="margin-left:16px">Wölbung</span>
        <div class="hbtn" data-curve="-0.04">−</div>
        <div class="hbtn" data-curve="0.04">+</div>
        <span style="margin-left:16px">Größe</span>
        <div class="hbtn" data-width="-0.15">−</div>
        <div class="hbtn" data-width="0.15">+</div>
        <span style="margin-left:16px">Laser</span>
        <div class="hbtn" data-pitch="-2">−</div>
        <span id="pitchval">45°</span>
        <div class="hbtn" data-pitch="2">+</div>
        <span style="margin-left:16px" title="+ = nach außen (je Hand gespiegelt)">H</span>
        <div class="hbtn" data-offx="-0.5">−</div>
        <span id="offxval">0</span>
        <div class="hbtn" data-offx="0.5">+</div>
        <span style="margin-left:16px" title="+ = nach oben">V</span>
        <div class="hbtn" data-offy="-0.5">−</div>
        <span id="offyval">0</span>
        <div class="hbtn" data-offy="0.5">+</div>
    </div>
</div>
<div id="bubble">
    <div class="icon">&#128172;</div>
    <div id="bubbleBadge" class="badge" style="display:none">0</div>
    <div id="bubbleDot" class="dot green"></div>
</div>
<div id="mini">
    <div class="head">
        <div id="miniDot" class="dot green"></div>
        <div class="title">Pool-Chat</div>
        <div id="miniBadge" class="badge" style="display:none">0</div>
    </div>
    <div id="miniWho" class="who"></div>
    <div id="miniTxt" class="txt">Keine neuen Nachrichten</div>
    <div class="hint">Antippen zum Öffnen</div>
</div>
<div id="cursor"></div>

<script>
(async function () {
    'use strict';
    let apiOk = true;
    try { await CefSharp.BindObjectAsync('AppApiVr'); } catch (e) { apiOk = false; }
    if (typeof AppApiVr === 'undefined') apiOk = false;

    const $ = (id) => document.getElementById(id);
    const state = {
        me: '', ampel: 'green', channels: [], active: 'global',
        big: false, autoShow: true, mode: 'hud',
        alpha: 0.9, curvature: 0.08, width: 0.6, laserPitch: 45,
        laserOffX: -6, laserOffY: -3.5,
        draft: '', lastUnread: 0, lastMsg: null
    };
    const EMOJIS = ['😀','😂','😍','🥰','😎','🤔','😭','😱','🥳','😴','👍','👎',
        '❤️','🔥','✨','🎉','💀','🙏','👋','💜','😈','🍕','🎮','📍'];

    function act(obj) {
        try { AppApiVr.ChatPanelAction(JSON.stringify(obj)); } catch (e) { apiOk = false; render(); }
    }
    function cfg(partial) {
        act(Object.assign({ type: 'config' }, partial));
    }

    // ------------------------------------------------------------- render --
    function chan() {
        return state.channels.find((c) => c.channel === state.active) || state.channels[0];
    }
    function totalUnread() {
        return state.channels.reduce((n, c) => n + (c.unread || 0), 0);
    }

    function render() {
        // Mini-Ansicht für alle Modi; C# blendet das Overlay komplett aus,
        // solange kein Flash-/Gesten-Fenster aktiv ist (keine Geisterfläche).
        const mini = !state.big;
        $('panel').classList.toggle('hidden', !state.big);
        $('bubble').classList.toggle('show', false);
        $('mini').classList.toggle('show', mini);
        $('ampel').className = 'dot ' + state.ampel;
        $('bubbleDot').className = 'dot ' + state.ampel;
        $('miniDot').className = 'dot ' + state.ampel;
        $('apiwarn').style.display = apiOk ? 'none' : 'block';
        const un = totalUnread();
        for (const id of ['bubbleBadge', 'miniBadge']) {
            $(id).style.display = un ? 'block' : 'none';
            $(id).textContent = un > 99 ? '99+' : un;
        }
        if (mini) {
            const m = state.lastMsg;
            $('miniWho').textContent = m ? m.name : '';
            $('miniTxt').textContent = m
                ? (m.kind === 'invite' ? '📍 Join-Einladung' : m.text)
                : 'Keine neuen Nachrichten';
        }
        if (!state.big) return;

        const tabs = $('tabs');
        tabs.innerHTML = '';
        for (const c of state.channels) {
            const t = document.createElement('div');
            t.className = 'tab' + (c.channel === state.active ? ' active' : '');
            t.textContent = c.label;
            if (c.unread) {
                const b = document.createElement('span');
                b.className = 'badge';
                b.textContent = c.unread > 99 ? '99+' : c.unread;
                t.appendChild(b);
            }
            t.onclick = () => {
                state.active = c.channel;
                // Historie nachladen, falls der Kanal noch leer ist
                if (!(c.messages || []).length) act({ type: 'history', channel: c.channel });
                markRead();
                render();
            };
            tabs.appendChild(t);
        }

        $('modebtn').textContent =
            state.mode === 'world' ? 'World' : state.mode === 'hud' ? 'HUD' : 'Wrist';
        $('pitchval').textContent = Math.round(state.laserPitch) + '°';
        $('offxval').textContent = state.laserOffX.toFixed(1);
        $('offyval').textContent = state.laserOffY.toFixed(1);

        const box = $('msgs');
        const ch = chan();
        box.innerHTML = '';
        for (const m of (ch ? ch.messages : [])) {
            const d = document.createElement('div');
            d.className = 'msg' + (m.mine ? ' mine' : '') + (m.kind === 'system' ? ' system' : '');
            if (m.kind === 'system') {
                d.textContent = m.text;
            } else if (m.kind === 'invite') {
                d.innerHTML = '<div class="who"></div><span class="invite">📍 Join-Einladung</span>';
                d.querySelector('.who').textContent = m.name;
            } else {
                d.innerHTML = '<div class="who"></div><div class="txt"></div>';
                d.querySelector('.who').textContent = m.mine ? '' : m.name;
                d.querySelector('.txt').textContent = m.text;
            }
            box.appendChild(d);
        }
        box.scrollTop = box.scrollHeight;

        $('typing').textContent = ch && ch.typing ? ch.typing + ' tippt…' : '';

        const quick = $('quick');
        quick.innerHTML = '';
        for (const q of (state.quickReplies || [])) {
            const b = document.createElement('div');
            b.className = 'qbtn';
            b.textContent = q;
            // Füllt die Chatbox (Senden separat) — testbar auch ohne IPC
            b.onclick = () => {
                state.draft = state.draft ? state.draft + ' ' + q : q;
                render();
            };
            quick.appendChild(b);
        }

        $('inputfield').textContent = state.draft || 'Nachricht eingeben…';
        $('inputfield').classList.toggle('empty', !state.draft);
        $('send').classList.toggle('disabled', !state.draft);
    }

    function markRead() {
        const ch = chan();
        if (ch && ch.unread && state.big) {
            ch.unread = 0;
            act({ type: 'read', channel: ch.channel });
        }
    }

    // ------------------------------------------------------- $vrchat API --
    window.$vrchat = {
        update(json) {
            try {
                const data = typeof json === 'string' ? JSON.parse(json) : json;
                state.me = data.me || state.me;
                state.ampel = data.ampel || 'green';
                state.quickReplies = data.quickReplies || state.quickReplies;
                const prevUnread = state.lastUnread;
                state.channels = data.channels || [];
                if (!state.channels.some((c) => c.channel === state.active) && state.channels[0]) {
                    state.active = state.channels[0].channel;
                }
                // letzte fremde Nachricht (für Mini-Ansicht)
                for (const c of state.channels) {
                    for (const m of c.messages || []) {
                        if (!m.mine && m.kind !== 'system') state.lastMsg = m;
                    }
                }
                state.lastUnread = totalUnread();
                if (state.autoShow && !state.big && state.lastUnread > prevUnread) {
                    // Mini für Flash-Zeit einblenden (alle Modi) — Groß nur
                    // per Antippen/Geste
                    cfg({ flash: true });
                }
                if (state.big) markRead();
                render();
            } catch (e) {}
        },
        config(json) {
            try {
                const c = typeof json === 'string' ? JSON.parse(json) : json;
                if (c.mode !== undefined) state.mode = c.mode;
                if (c.alpha !== undefined) state.alpha = c.alpha;
                if (c.curvature !== undefined) state.curvature = c.curvature;
                if (c.width !== undefined) state.width = c.width;
                if (c.autoShow !== undefined) state.autoShow = c.autoShow;
                if (c.big !== undefined) state.big = c.big;
                if (c.laserPitch !== undefined) state.laserPitch = c.laserPitch;
                if (c.laserOffX !== undefined) state.laserOffX = c.laserOffX;
                if (c.laserOffY !== undefined) state.laserOffY = c.laserOffY;
                if (c.quickReplies !== undefined) state.quickReplies = c.quickReplies;
                render();
            } catch (e) {}
        },
        keyboardDone(text) {
            // Zeichenstrom (keyboardChar) ist die primäre Quelle. Done nur
            // übernehmen, wenn wirklich Text kommt — das Häkchen darf die
            // Chatbox nie leeren.
            const t = (text || '').trim();
            if (t) state.draft = t;
            render();
        },
        keyboardChar(text) {
            // Live-Zeichenstrom der SteamVR-Tastatur (\b = löschen)
            for (const ch of text || '') {
                if (ch === '\b') state.draft = state.draft.slice(0, -1);
                else if (ch === '\n' || ch === '\r') continue;
                else state.draft += ch;
            }
            render();
        },
        cursor(x, y) {
            const c = $('cursor');
            if (x < 0 || y < 0) {
                c.style.display = 'none';
                return;
            }
            c.style.display = 'block';
            c.style.left = x + 'px';
            c.style.top = y + 'px';
        },
        gestureToggle() {
            state.big = !state.big;
            cfg({ big: state.big });
            if (state.big) markRead();
            render();
        }
    };

    // ------------------------------------------------------------ events --
    $('minbtn').onclick = () => $vrchat.gestureToggle();
    $('bubble').onclick = () => $vrchat.gestureToggle();
    $('mini').onclick = () => $vrchat.gestureToggle();
    $('inputfield').onclick = () => act({ type: 'keyboard', text: state.draft });
    $('send').onclick = () => {
        const ch = chan();
        if (!state.draft || !ch) return;
        act({ type: 'send', channel: ch.channel, text: state.draft });
        state.draft = '';
        render();
    };
    $('modebtn').onclick = () => {
        state.mode = state.mode === 'wrist' ? 'hud' : state.mode === 'hud' ? 'world' : 'wrist';
        cfg({ mode: state.mode, place: true });
        render();
    };
    $('emojibtn').onclick = () => {
        const box = $('emojis');
        if (!box.childElementCount) {
            for (const em of EMOJIS) {
                const b = document.createElement('div');
                b.className = 'ebtn';
                b.textContent = em;
                b.onclick = () => {
                    state.draft = (state.draft || '') + em;
                    render();
                };
                box.appendChild(b);
            }
        }
        box.classList.toggle('open');
    };
    $('gearbtn').onclick = () => {
        const open = $('settings').classList.toggle('open');
        $('dragbar').style.display = open ? 'none' : 'block';
        cfg({ dragLock: open }); // Settings offen => Dragbar gesperrt
    };
    for (const el of document.querySelectorAll('[data-alpha]')) {
        el.onclick = () => {
            state.alpha = Math.min(1, Math.max(0.2, state.alpha + parseFloat(el.dataset.alpha)));
            cfg({ alpha: state.alpha });
        };
    }
    for (const el of document.querySelectorAll('[data-curve]')) {
        el.onclick = () => {
            state.curvature = Math.min(0.4, Math.max(0, state.curvature + parseFloat(el.dataset.curve)));
            cfg({ curvature: state.curvature });
        };
    }
    for (const el of document.querySelectorAll('[data-width]')) {
        el.onclick = () => {
            state.width = Math.min(2.5, Math.max(0.2, state.width + parseFloat(el.dataset.width)));
            cfg({ width: state.width });
        };
    }
    for (const el of document.querySelectorAll('[data-pitch]')) {
        el.onclick = () => {
            state.laserPitch = Math.min(90, Math.max(-30, state.laserPitch + parseFloat(el.dataset.pitch)));
            cfg({ laserPitch: state.laserPitch });
            render();
        };
    }
    for (const el of document.querySelectorAll('[data-offx]')) {
        el.onclick = () => {
            state.laserOffX = Math.min(10, Math.max(-10, state.laserOffX + parseFloat(el.dataset.offx)));
            cfg({ laserOffX: state.laserOffX });
            render();
        };
    }
    for (const el of document.querySelectorAll('[data-offy]')) {
        el.onclick = () => {
            state.laserOffY = Math.min(10, Math.max(-10, state.laserOffY + parseFloat(el.dataset.offy)));
            cfg({ laserOffY: state.laserOffY });
            render();
        };
    }

    render();
    // Frischen State vom Mod anfordern (Panel startet sonst leer, bis sich
    // etwas ändert — z. B. nach Overlay-Neustart).
    act({ type: 'refresh' });
})();
</script>
</body>
</html>
